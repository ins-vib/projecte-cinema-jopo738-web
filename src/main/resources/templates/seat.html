<div th:replace="~{layout :: layout(~{::content})}">

    
<div th:fragment="content">
    <style>
        .cinema-container {
            background-color: #121212;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        h1 { color: #e50914; text-transform: uppercase; margin-bottom: 20px; }

        /* Estil de la pantalla del cinema */
        .screen {
            width: 80%;
            height: 10px;
            background: linear-gradient(to bottom, #fff, #555);
            margin: 0 auto 50px;
            border-radius: 50%;
            box-shadow: 0 5px 20px rgba(255,255,255,0.4);
        }

        .btn-action {
            display: inline-block;
            background-color: #333;
            color: #ccc;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .btn-action:hover { background-color: #e50914; color: white; }

        /* Estil de les cadires SVG */
        .seat {
        cursor: pointer;
        color: #444; /* Color gris per defecte */
        transition: color 0.3s; /* Només animem el color, no el moviment */
    }

    .seat:hover {
        color: #e50914; /* Només canvia a vermell Netflix */
        transform: none; /* Ens assegurem que no hi hagi cap moviment */
    }

    /* Opcional: una petita ombra o resplendor en lloc de moure-la */
    /* .seat:hover {
        filter: drop-shadow(0 0 5px rgba(229, 9, 20, 0.8));
    } */

        svg {
    max-width: 100%;
    height: auto;
    
    /* ELIMINEM QUALSEVOL REQUADRE */
    border: none !important;
    outline: none !important;
    background: none !important;
    background-color: transparent !important;
    
    /* TREIEM OMBRES QUE PUGUI TENIR L'ELEMENT */
    box-shadow: none !important;
    
    padding: 20px;
}

/* També per si de cas el navegador posa un borde a l'enllaç que envolta la cadira */
svg a {
    outline: none !important;
    border: none !important;
    text-decoration: none !important;
}

/* I treiem el borde de la pantalla que encara es veu una mica a la foto */
.screen {
    border: none !important;
}

        
    </style>

    <div class="cinema-container">
        <h1>SALA: <span th:text="${room.name}">Nom</span></h1>
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a th:href="@{/cinema/{id}(id=${room.cinema.id})}" class="btn-action">Tornar al Cinema</a>
            <a th:href="@{/seats/room/{id}/new(id=${room.id})}" class="btn-action">Afegir Cadira</a>
        </div>

        <div class="screen"></div>
        <p style="color: #666; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 20px;">Pantalla</p>

        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <g th:each="seat : ${seats}">
                <a th:href="@{/seat/update/{id}(id=${seat.id})}" th:title="|Fila: ${seat.posY}, Col: ${seat.posX}|">
                    <svg class="seat" 
                         viewBox="0 0 491.5 491.5" 
                         width="35" height="35"
                         th:x="${seat.posX * 45}" 
                         th:y="${seat.posY * 45}"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M449.149,216.2v-99c0-64.7-53.4-117.2-119.1-117.2h-168.4
                        c-65.6,0-119.1,52.6-119.1,117.2v99
                        c-25,12.1-42.5,37.5-42.5,67.1v208.2h163.8V471h163.8v20.5h163.8V283.3
                        C491.649,253.7,474.149,228.2,449.149,216.2z..." fill="currentColor"/>
                    </svg>
                </a>
            </g>
        </svg>
    </div>
</div>
