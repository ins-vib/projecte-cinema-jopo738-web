<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registre - CineApp</title>
    <style>
        :root {
            --primary: #e50914;
            --dark-bg: #141414;
            --card-bg: #222222;
            --text-light: #ffffff;
            --text-gray: #b3b3b3;
            --input-bg: #333333;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* CONTENIDOR DEL FORMULARI */
        .register-card {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 60px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: left;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-gray);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        /* ESTILS DELS INPUTS */
        .form-group {
            margin-bottom: 20px;
        }

        input[type="text"], 
        input[type="password"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 4px;
            background-color: var(--input-bg);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: background 0.2s, border 0.2s;
            border: 1px solid transparent;
        }

        input:focus {
            background-color: #454545;
            border: 1px solid var(--text-gray);
        }

        /* BOTÓ CREAR */
        .btn-register {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-register:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }

        /* LINK TORNAR */
        .footer-links {
            margin-top: 30px;
            text-align: center;
        }

        .footer-links a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-links a:hover {
            color: var(--text-light);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h1>Registre</h1>
        <p class="subtitle">Crea un compte per començar a gaudir del cinema.</p>

        <form th:action="@{/registrar/save}" th:object="${user}" method="post">
            <div class="form-group">
                <input type="text" name="username" placeholder="Nom d'usuari" required th:field="*{username}"/>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Contrasenya" required th:field="*{password}"/>
            </div>
            
            <button type="submit" class="btn-register">Crear Compte</button>
        </form>

        <div class="footer-links">
            <a th:href="@{/login}">Ja tens compte? Inicia sessió</a>
        </div>
    </div>

</body>
</html>
