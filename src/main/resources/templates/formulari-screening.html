<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">

        <style>
            .form-box {
                background-color: #1a1a1a;
                padding: 30px;
                border-radius: 8px;
                max-width: 500px;
                border: 1px solid #333;
                color: white;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                margin-top: 20px;
            }

            h2 { 
                color: #e50914; 
                text-transform: uppercase; 
                margin-bottom: 5px; 
            }

            h3 {
                color: #ccc;
                font-size: 1.1rem;
                margin-bottom: 25px;
                border-bottom: 2px solid #333;
                padding-bottom: 10px;
            }

            label { 
                color: #e50914; 
                font-weight: bold; 
                text-transform: uppercase; 
                font-size: 0.85rem; 
                display: block; 
                margin-bottom: 5px; 
            }

            input[type="datetime-local"], 
            input[type="number"],
            select { 
                width: 100%; 
                background-color: #333; 
                border: 1px solid #444; 
                color: white; 
                padding: 12px; 
                border-radius: 4px; 
                box-sizing: border-box; 
                font-size: 1rem;
            }

            input:focus, select:focus { 
                border-color: #e50914; 
                outline: none; 
                background-color: #3d3d3d;
            }

            /* Estil per a la icona del calendari */
            input::-webkit-calendar-picker-indicator {
                filter: invert(1);
                cursor: pointer;
            }

            button { 
                background-color: #e50914; 
                color: white; 
                border: none; 
                padding: 14px; 
                width: 100%; 
                font-weight: bold; 
                text-transform: uppercase; 
                cursor: pointer; 
                border-radius: 4px; 
                margin-top: 20px;
                transition: background 0.3s;
            }

            button:hover { 
                background-color: #b20710; 
            }

            .spacer {
                margin-bottom: 20px;
            }

            select option {
                background-color: #1a1a1a;
            }
        </style>

        <div class="form-box">
            <h2>Projecció</h2>
            <h3 th:text="|Pel·lícula: ${screening.movie.titol}|"></h3>
            
            <form th:action="@{/screenings/save}" th:object="${screening}" method="post">

                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{movie.id}"/>

                <div class="spacer">
                    <label>Data i Hora:</label>
                    <input type="datetime-local" th:field="*{screeningDateTime}" required/>
                </div>

                <div class="spacer">
                    <label>Preu de l'entrada (€):</label>
                    <input type="number" step="0.01" th:field="*{price}" required placeholder="Ex: 8.50"/>
                </div>

                <div class="spacer">
                    <label>Selecciona una sala:</label>
                    <select th:field="*{room}" required>
                        <option value="">-- Selecciona una sala --</option>
                        <option th:each="r : ${rooms}"
                                th:value="${r.id}"
                                th:text="${r.name} + ' (Capacitat: ' + ${r.capacity} + ')'">
                        </option>
                    </select>
                </div>

                <button type="submit">Guardar Projecció</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
