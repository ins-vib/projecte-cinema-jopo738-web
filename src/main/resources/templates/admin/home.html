<!DOCTYPE html>
<!-- <html xmlns:th="http://www.thymeleaf.org"> -->
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - CineApp</title>
    <style>
        :root {
            --primary: #e50914;
            --dark-bg: #111111;
            --card-bg: #1f1f1f;
            --text-light: #ffffff;
            --text-gray: #aaaaaa;
            --sidebar-width: 250px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
        }

        /* CAPÇALERA */
        header {
            background-color: #000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--primary);
        }

        /* CONTINGUT PRINCIPAL */
        .admin-container {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .welcome-section {
            margin-bottom: 40px;
        }

        .welcome-section h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .welcome-section p {
            color: var(--text-gray);
        }

        /* GRELLA DE GESTIÓ (Targetes) */
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .admin-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s, background-color 0.3s;
            border: 1px solid #333;
        }

        .admin-card:hover {
            transform: translateY(-5px);
            background-color: #252525;
            border-color: var(--primary);
        }

        .admin-card h3 {
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 1.1rem;
        }

        .admin-card a {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* LOGOUT BOTÓ */
        .logout-container {
            margin-top: 50px;
            text-align: center;
        }

        .btn-logout {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid var(--text-gray);
            padding: 8px 20px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            color: white;
            background-color: #333;
            border-color: white;
        }
    </style>
</head>
<body>
