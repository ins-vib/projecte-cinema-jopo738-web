<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Benvingut al Cinema - CineApp</title>
    <style>
        :root {
            --primary: #e50914;
            --dark-bg: #141414;
            --card-bg: #222222;
            --text-light: #ffffff;
            --text-gray: #b3b3b3;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* NAV BAR FIXA */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            background-color: rgba(0, 0, 0, 0.9);
            box-sizing: border-box;
            z-index: 1000;
        }

        .logo {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .btn-nav {
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid white;
        }

        .btn-nav:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
        }

        .hero {
            height: 60vh;
            width: 100%;
            background: linear-gradient(rgba(20,20,20,0.4), var(--dark-bg)), 
                        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 70px;
        }

        .hero h1 {
            font-size: 4rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .hero p {
            font-size: 1.5rem;
            color: var(--text-gray);
            margin-top: 10px;
        } */

        /* SECCIÓ DE NOTÍCIES */
        .news-section {
            padding: 50px 20px;
            width: 100%;
            max-width: 1000px;
        }

        .news-section h2 {
            border-left: 4px solid var(--primary);
            padding-left: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .news-card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            transition: 0.3s;
            border-bottom: 3px solid transparent;
        }

        .news-card:hover {
            transform: translateY(-10px);
            border-bottom: 3px solid var(--primary);
            background-color: #2a2a2a;
        }

        .news-card h3 {
            margin-top: 0;
            color: var(--text-light);
            font-size: 1.3rem;
        }

        .news-card p {
            color: var(--text-gray);
            line-height: 1.6;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <a href="/" class="logo">Cine</a>
        <ul class="nav-links">
            <li><a th:href="@{/login}" class="btn-nav btn-outline">INICIA SESSIÓ</a></li>
            <li><a th:href="@{/registrar}" class="btn-nav">REGISTRAR-SE</a></li>
        </ul>
    </nav>
<br>
<br>
<br>
<br>
<br>
<br>
    <header class="hero">
        <h1>BENVINGUT AL CINEMA</h1>
       
    </header>

    <section class="news-section">
        <h2>Últimes Notícies</h2>
        <div class="news-grid">
            <div class="news-card" th:each="noticia : ${llista}">
                <h3 th:text="${noticia.headline}">Títol de la notícia</h3>
                <p th:text="${noticia.body}">Contingut de la notícia</p>
            </div>
        </div>
    </section>

</body>
</html>
