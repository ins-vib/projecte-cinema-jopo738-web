<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::content})}">

    <div th:fragment="content">

        <style>
            .room-detail-card {
                background-color: #1a1a1a;
                padding: 40px;
                border-radius: 12px;
                max-width: 600px;
                border: 1px solid #333;
                box-shadow: 0 8px 30px rgba(0,0,0,0.7);
                margin: 20px auto; /* Centrat a la pantalla */
            }

            h2 {
                color: #e50914;
                text-transform: uppercase;
                letter-spacing: 2px;
                margin-bottom: 30px;
                border-bottom: 2px solid #e50914;
                display: inline-block;
                padding-bottom: 5px;
            }

            .detail-row {
                margin-bottom: 25px;
                display: flex;
                align-items: center;
                border-bottom: 1px solid #252525;
                padding-bottom: 15px;
            }

            .detail-row strong {
                color: #e50914;
                text-transform: uppercase;
                font-size: 0.9rem;
                width: 150px;
                display: inline-block;
            }

            .detail-row p {
                color: #ffffff;
                margin: 0;
                font-size: 1.2rem;
                font-weight: bold;
            }

            /* Icona decorativa per a la capacitat */
            .capacity-badge {
                background-color: #333;
                color: #e50914;
                padding: 5px 15px;
                border-radius: 20px;
                font-size: 1rem;
                border: 1px solid #444;
            }

            .btn-back {
                display: inline-block;
                margin-top: 20px;
                color: #888;
                text-decoration: none;
                font-size: 0.9rem;
                text-transform: uppercase;
                transition: color 0.3s, transform 0.2s;
            }

            .btn-back:hover {
                color: #e50914;
                transform: translateX(-5px);
            }
        </style>

        <div class="room-detail-card">
            <h2>DETALLS SALA:</h2>
            
            <section>
                <div class="detail-row">
                    <strong>Nom:</strong>
                    <p th:text="${room.name}">Nom de la sala</p>
                </div>

                <div class="detail-row">
                    <strong>Capacitat:</strong>
                    <p>
                        <span class="capacity-badge">
                            <span th:text="${room.capacity}">0</span> butaques
                        </span>
                    </p>
                </div>

                <a th:href="@{/cinema/{id}(id=${room.cinema.id})}" class="btn-back">
                    Tornar al Cinema
                </a>
            </section>
        </div>

    </div>
</div>
</body>
</html>
