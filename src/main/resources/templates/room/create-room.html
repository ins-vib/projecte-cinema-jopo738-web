<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::content})}">

    <div th:fragment="content">

        <style>
            .form-box {
                background-color: #1a1a1a;
                padding: 30px;
                border-radius: 8px;
                max-width: 500px;
                border: 1px solid #333;
                color: white;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                margin-top: 20px;
            }

            h2 { 
                color: #e50914; 
                text-transform: uppercase; 
                margin-bottom: 25px; 
                border-bottom: 2px solid #333; 
                padding-bottom: 10px; 
            }

            label { 
                color: #e50914; 
                font-weight: bold; 
                text-transform: uppercase; 
                font-size: 0.85rem; 
                display: block; 
                margin-bottom: 5px; 
            }

            input[type="text"], 
            input[type="number"] { 
                width: 100%; 
                background-color: #333; 
                border: 1px solid #444; 
                color: white; 
                padding: 12px; 
                border-radius: 4px; 
                box-sizing: border-box; 
                font-size: 1rem;
            }

            input:focus { 
                border-color: #e50914; 
                outline: none; 
                background-color: #3d3d3d;
            }

            button { 
                background-color: #e50914; 
                color: white; 
                border: none; 
                padding: 14px; 
                width: 100%; 
                font-weight: bold; 
                text-transform: uppercase; 
                cursor: pointer; 
                border-radius: 4px; 
                margin-top: 20px;
                transition: background 0.3s;
            }

            button:hover { 
                background-color: #b20710; 
            }

            /* Estil per als missatges d'error */
            .error-text {
                color: #ff4d4d;
                font-size: 0.8rem;
                margin-top: 5px;
                margin-bottom: 15px;
                font-weight: bold;
                display: block;
            }

            .spacer {
                margin-bottom: 20px;
            }
        </style>

        <div class="form-box">
            <h2>CREAR SALA:</h2>
            <form th:action="@{/room/create/{cinemaId}(cinemaId=${cinemaId})}" th:object="${room}" method="post">
                
                <div class="spacer">
                    <label>Nom de la sala:</label>
                    <input type="text" th:field="*{name}" />
                    <span class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>

                <div class="spacer">
                    <label>Capacitat:</label>
                    <input type="number" th:field="*{capacity}" min="1"/>
                    <span class="error-text" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></span>
                </div>

                <button type="submit">Guardar Sala</button>

            </form>
        </div>

    </div>
</div>

</body>
</html>
