<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a; /* Fons fosc suau */
            color: white;
            padding: 20px;
        }

        h1 { color: #e50914; }

        /* Estil de la taula */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #2b2b2b;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th { background-color: #333; color: #e50914; }

        /* Botons senzills */
        .btn {
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 13px;
            margin-right: 5px;
            display: inline-block;
        }

        .btn-nou { background: #e50914; color: white; margin-bottom: 15px; }
        .btn-detall { background: #555; color: white; }
        .btn-edit { background: #f1c40f; color: black; }
        .btn-delete { background: #900; color: white; }

        tr:hover { background: #383838; }
    </style>
</head>
<body>

<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">

        <h1>Llista cinemes</h1>
        <a th:href="@{/cinema/create}" class="btn btn-nou"> + Afegeix nou cinema</a>

        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Ciutat</th>
                    <th>Accions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cinema : ${llista}">
                    <td th:text="${cinema.name}">Nom</td>
                    <td th:text="${cinema.city}">Ciutat</td>
                    <td>
                        <a th:href="@{/cinema/{id}(id=${cinema.id})}" class="btn btn-detall">Veure</a>
                        <a th:href="@{/cinema/update/{id}(id=${cinema.id})}" class="btn btn-edit">Editar</a>
                        <a th:href="@{/cinema/delete/{id}(id=${cinema.id})}" class="btn btn-delete">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>
</div>

</body>
</html>
