<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">

        <style>
            .form-box {
                background-color: #1a1a1a;
                padding: 30px;
                border-radius: 8px;
                max-width: 500px;
                border: 1px solid #333;
                color: white;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                margin-top: 20px;
            }

            h2 { 
                color: #e50914; 
                text-transform: uppercase; 
                margin-bottom: 25px; 
                border-bottom: 2px solid #333; 
                padding-bottom: 10px; 
            }

            label { 
                color: #e50914; 
                font-weight: bold; 
                text-transform: uppercase; 
                font-size: 0.85rem; 
                display: block; 
                margin-bottom: 5px; 
            }

            input[type="text"], 
            input[type="number"],
            input[type="date"],
            textarea { 
                width: 100%; 
                background-color: #333; 
                border: 1px solid #444; 
                color: white; 
                padding: 12px; 
                border-radius: 4px; 
                box-sizing: border-box; 
                font-size: 1rem;
                font-family: inherit;
            }

            textarea {
                min-height: 100px;
                resize: vertical;
            }

            input:focus, textarea:focus { 
                border-color: #e50914; 
                outline: none; 
                background-color: #3d3d3d;
            }

            button { 
                background-color: #e50914; 
                color: white; 
                border: none; 
                padding: 14px; 
                width: 100%; 
                font-weight: bold; 
                text-transform: uppercase; 
                cursor: pointer; 
                border-radius: 4px; 
                margin-top: 20px;
                transition: background 0.3s;
            }

            button:hover { 
                background-color: #b20710; 
            }

            .error-text {
                color: #ff4d4d;
                font-size: 0.8rem;
                margin-top: 5px;
                margin-bottom: 15px;
                font-weight: bold;
                display: block;
            }

            .spacer {
                margin-bottom: 20px;
            }

            /* Ajust per a la icona del calendari en Chrome/Edge */
            input[type="date"]::-webkit-calendar-picker-indicator {
                filter: invert(1);
                cursor: pointer;
            }
        </style>

        <div class="form-box">
    <h2>CREAR / EDITAR PEL·LÍCULA:</h2>
    <form th:action="@{/movies/save}" th:object="${pelicula}" method="post">
        
        <input type="hidden" th:field="*{id}" />

        <div class="spacer">
            <label>Títol:</label>
            <input type="text" th:field="*{titol}" />
            <span class="error-text" th:if="${#fields.hasErrors('titol')}" th:errors="*{titol}"></span>
        </div>

        <div class="spacer">
            <label>Durada (minuts):</label>
            <input type="number" th:field="*{durada}" required/>
            <span class="error-text" th:if="${#fields.hasErrors('durada')}" th:errors="*{durada}"></span>
        </div>

        <div class="spacer">
            <label>CLASSIFICACIONS (GÈNERES):</label>
            <div style="background-color: #222; padding: 15px; border-radius: 4px; border: 1px solid #444; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div th:each="g : ${totsElsGeneres}" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" 
                           th:field="*{generes}" 
                           th:value="${g.id}" 
                           th:id="${'gen-' + g.id}"
                           style="accent-color: #e50914; width: 18px; height: 18px; cursor: pointer;" />
                    <label th:for="${'gen-' + g.id}" 
                           th:text="${g.nom}" 
                           style="color: #ccc; text-transform: none; font-weight: normal; cursor: pointer; margin: 0;">
                    </label>
                </div>
            </div>
            <span class="error-text" th:if="${#fields.hasErrors('generes')}" th:errors="*{generes}"></span>
        </div>
          <div class="spacer">
                    <label>Descripció / sinopsi:</label>
                    <textarea th:field="*{descripcio}" ></textarea>
                    <span class="error-text" th:if="${#fields.hasErrors('descripcio')}" th:errors="*{descripcio}"></span>
                </div>

                <div class="spacer">
                    <label>Data d'estrena:</label>
                    <input type="date" th:field="*{data_estrena}" required/>
                    <span class="error-text" th:if="${#fields.hasErrors('data_estrena')}" th:errors="*{data_estrena}"></span>
                </div>

                <button type="submit">Guardar Pel·lícula</button>
            </form>
        </div>

    </div>
</div>

</body>
</html>
