<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmació</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Personalització sobre Bootstrap per mantenir l'estil Cinema */
        body {
            background-color: #141414; /* Fons fosc */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #222222 !important; /* Gris fosc de la card */
            border: none;
            color: white;
            max-width: 500px;
            width: 100%;
        }

        .text-success {
            color: #46d369 !important; /* Verd viu per l'èxit */
        }

        .alert-info {
            background-color: #1a1a1a !important;
            border: 1px dashed #e50914 !important; /* Vora vermella de cinema */
            color: #ffffff !important;
        }

        .btn-primary {
            background-color: #e50914 !important; /* Vermell cinema */
            border: none;
            padding: 10px 30px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-primary:hover {
            background-color: #b20710 !important;
            transform: scale(1.05);
        }

        .lead {
            color: #b3b3b3;
        }
    </style>
</head>
<body class="container mt-5 text-center">
    <div class="card shadow p-4">
        <h1 class="text-success"> Compra Finalitzada</h1>
        <p class="lead">Gràcies per la teva reserva.</p>
        
        <div class="alert alert-info">
            <h4>Total pagat: <span th:text="${totalFinal}">0.00</span>€</h4>
        </div>

        <a href="/client" class="btn btn-primary">Tornar a l'Inici</a>
    </div>
</body>
</html>
