<style>
    :root {
        --primary: #e50914;
        --primary-hover: #b2070f;
        --dark-bg: #141414;
        --card-bg: #222222;
        --text-light: #ffffff;
        --text-gray: #b3b3b3;
    }

    body {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: var(--dark-bg);
        color: var(--text-light);
        margin: 0;
        padding: 100px 40px;
    }

    /* NAV BAR REUTILITZADA */
    .nav-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 70px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 0 50px;
        background-color: rgba(20, 20, 20, 0.95);
        box-sizing: border-box;
        z-index: 1000;
        gap: 20px;
    }

    .btn-nav {
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-weight: bold;
        color: var(--text-light);
        border: 1px solid var(--text-gray);
        transition: 0.3s;
    }

    .btn-nav:hover {
        background-color: var(--text-light);
        color: var(--dark-bg);
    }

    h1 {
        font-size: 2rem;
        border-left: 5px solid var(--primary);
        padding-left: 15px;
        margin-bottom: 40px;
    }

    /* CONTENIDOR DE SESSIONS */
    .sessions-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
    }

    .session-card {
        background-color: var(--card-bg);
        border-radius: 10px;
        padding: 25px;
        border: 1px solid #333;
        transition: transform 0.3s;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .session-card:hover {
        transform: translateY(-5px);
        border-color: var(--primary);
    }

    .session-time {
        font-size: 1.4rem;
        font-weight: bold;
        color: var(--text-light)
    }

    .session-room {
        color: var(--text-gray);
        font-size: 1rem;
        margin-bottom: 15px;
    }

    /* BOTÓ SELECCIONAR BUTAQUES */
    .btn-select {
        display: inline-block;
        text-align: center;
        background-color: var(--primary);
        color: white;
        text-decoration: none;
        padding: 12px;
        border-radius: 5px;
        font-weight: bold;
        text-transform: uppercase;
        transition: background 0.3s;
    }

    .btn-select:hover {
        background-color: var(--primary-hover);
    }

    .no-sessions {
        background-color: #331111;
        padding: 20px;
        border-radius: 8px;
        color: #ff8888;
    }
</style>
<body>
    <nav class="nav-bar">
        <a th:href="@{/client}" class="btn-nav"> TORNAR A PEL·LÍCULES</a>
        <a href="/logout" class="btn-nav" style="background: var(--primary); border:none;">LOGOUT</a>
    </nav>

    <h1 th:text="'Sessions per a: ' + ${movie.titol}">Sessions</h1>

    <div th:if="${#lists.isEmpty(sessions)}" class="no-sessions">
        <p> No hi ha sessions disponibles per aquesta pel·lícula actualment.</p>
    </div>

    <div class="sessions-grid">
        <div th:each="sessio : ${sessions}" class="session-card">
            <div class="session-time">
                DIA: <span th:text="${#temporals.format(sessio.screeningDateTime, 'dd/MM/yyyy')}"></span><br>
                HORA: <span th:text="${#temporals.format(sessio.screeningDateTime, 'HH:mm')}"></span>
            </div>
            
            <div class="session-room">
                 Sala: <span th:text="${sessio.room.name}"></span>
            </div>
            <div class="session-price">
    <span class="price-value" 
          th:text="${#numbers.formatDecimal(sessio.price, 1, 2, 'COMMA')} + '€'">
    </span>
</div>
            
            <a th:href="@{/client/comprar/{id}(id=${sessio.id})}" class="btn-select">
                Seleccionar butaques
            </a>
        </div>
    </div>
</body>
