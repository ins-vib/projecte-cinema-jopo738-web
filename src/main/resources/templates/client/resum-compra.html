<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <style>
    :root {
        --primary: #e50914;
        --dark-bg: #141414;
        --card-bg: #222222;
        --text-light: #ffffff;
        --text-gray: #b3b3b3;
    }

    body {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: var(--dark-bg);
        color: var(--text-light);
        margin: 0;
        padding: 100px 20px;
    }

    /* BARRA SUPERIOR (NAVBAR) */
    .nav-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 70px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 0 50px;
        background-color: #000;
        box-sizing: border-box;
        z-index: 1000;
    }

    .btn-nav {
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 4px;
        font-weight: bold;
        color: white;
        background-color: var(--primary);
        border: none;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
    }

    h2 {
        border-left: 5px solid var(--primary);
        padding-left: 15px;
        margin-bottom: 30px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    /* ESTIL DE LA TAULA */
    .resum-table {
        width: 100%;
        border-collapse: collapse;
        background-color: var(--card-bg);
        border-radius: 8px;
        overflow: hidden; /* Perquè es vegin les puntes arrodonides */
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .resum-table th, .resum-table td {
        padding: 20px;
        text-align: left;
        border-bottom: 1px solid #333;
    }

    .resum-table th {
        background-color: #2a2a2a;
        color: var(--primary);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .resum-table td {
        font-size: 1.1rem;
    }

    .resum-table tr:last-child td {
        border-bottom: none;
    }

    .seients-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .seient-tag {
        background-color: var(--primary);
        padding: 4px 12px;
        border-radius: 4px;
        font-size: 0.9rem;
        font-weight: bold;
    }

    /* BOTÓ TORNAR */
    .btn-container {
        text-align: center;
        margin-top: 40px;
    }

    .btn-back {
        background-color: transparent;
        border: 2px solid var(--text-gray);
        color: var(--text-gray);
        padding: 12px 30px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn-back:hover {
        border-color: var(--text-light);
        color: var(--text-light);
        background-color: rgba(255,255,255,0.05);
    }
</style>
<head>
    <title>Resum de la reserva</title>
    
</head>
<body>

    <nav class="nav-bar">
        <a th:href="@{/client}" class="btn-nav">TORNAR A L'INICI</a>
    </nav>

    <div class="container">
        <h2>Detalls de la teva reserva</h2>
        
        <table class="resum-table">
            <thead>
                <tr>
                    <th colspan="2">Informació de la sessió</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="color: var(--text-gray); width: 30%;">Pel·lícula</td>
                    <td th:text="${screening.movie.titol}">Nom de la pel·lícula</td>
                </tr>
                <tr>
                    <td style="color: var(--text-gray);">Data i Hora</td>
                    <td th:text="${#temporals.format(screening.screeningDateTime, 'dd/MM/yyyy HH:mm')}">12/04/2026 18:00</td>
                </tr>
                <tr>
                    <td style="color: var(--text-gray);">Sala</td>
                    <td th:text="${screening.room.name}">Sala principal</td>
                </tr>
                <tr>
                    <td style="color: var(--text-gray);">Butaques</td>
                    <td>
                        <div class="seients-list">
                            <span th:each="s : ${seients}" class="seient-tag">
                                <span th:text="${s.id}"></span>
                            </span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="btn-container">
            <a th:href="@{/client}" class="btn-back">Finalitzar i sortir</a>
        </div>
    </div>

</body>
</html>
