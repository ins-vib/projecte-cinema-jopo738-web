
<!-- <h1>Pel·lícules disponibles</h1> -->
<style>
    /* VARIABLES DE COLOR */
    :root {
        --primary: #e50914;      /* Vermell intens */
        --primary-hover: #b2070f;
        --dark-bg: #141414;      /* Fons fosc */
        --card-bg: #222222;      /* Fons targetes */
        --text-light: #ffffff;
        --text-gray: #b3b3b3;
        --success: #4CAF50;
    }

    /* ESTILS GENERALS */
    body {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: var(--dark-bg);
        color: var(--text-light);
        margin: 0;
        padding: 100px 40px 40px 40px; /* Espai dalt per la barra fixa */
        -webkit-font-smoothing: antialiased;
    }

    h1 {
        font-size: 2.5rem;
        margin-bottom: 30px;
        font-weight: bold;
    }

    /* BARRA DE NAVEGACIÓ (NAVBAR) */
    .nav-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 70px;
        display: flex;
        justify-content: flex-end; /* Botons a la dreta */
        align-items: center;
        padding: 0 50px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(20,20,20,0) 100%);
        background-color: var(--dark-bg); /* Color sòlid si no hi ha scroll */
        box-sizing: border-box;
        z-index: 1000;
        gap: 20px;
    }

    /* BOTONS DE LA NAV-BAR */
    .btn-nav {
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-comandes {
        background-color: transparent;
        border: 1px solid var(--text-gray);
        color: var(--text-light);
    }

    .btn-comandes:hover {
        border-color: var(--text-light);
        background-color: rgba(255,255,255,0.1);
    }

    .btn-logout {
        background-color: var(--primary);
        color: white;
        border: none;
    }

    .btn-logout:hover {
        background-color: var(--primary-hover);
    }

    /* GRAELLA DE PEL·LÍCULES */
    .movie-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 30px;
    }

    /* TARGETA DE PEL·LÍCULA */
    .movie-card {
        background-color: var(--card-bg);
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 180px;
        border: 1px solid #333;
    }

    .movie-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        background-color: #2a2a2a;
    }

    .movie-card h3 {
        margin: 0 0 20px 0;
        font-size: 1.3rem;
        color: var(--text-light);
    }

    /* BOTÓ SESSIONS (DECORAT) */
    .btn-sessions {
        display: block;
        background: linear-gradient(135deg, var(--primary) 0%, #9b060d 100%);
        color: white;
        text-decoration: none;
        padding: 12px;
        border-radius: 30px;
        font-weight: bold;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
    }

    .btn-sessions:hover {
        box-shadow: 0 6px 18px rgba(229, 9, 20, 0.5);
        transform: scale(1.03);
    }

    /* ADAPTACIÓ PER A MÒBILS */
    @media (max-width: 600px) {
        .nav-bar {
            padding: 0 20px;
            gap: 10px;
        }
        .btn-nav {
            padding: 8px 12px;
            font-size: 0.75rem;
        }
        body {
            padding: 90px 20px 20px 20px;
        }
    }

    /* Estils per a la durada i el gènere */
.movie-details {
    color: var(--text-gray);
    font-size: 0.85rem;
    margin-bottom: 20px;
    display: flex;
    justify-content: center;
    gap: 8px;
    font-weight: 500;
}

.separator {
    color: var(--primary); /* El separador en vermell queda molt bé */
    font-weight: bold;
}
</style>
<body>
    <nav class="nav-bar">
        <a th:href="@{/client/llista-comandes}" class="btn-nav btn-comandes">LLISTA COMANDES</a>
        <a href="/logout" class="btn-nav btn-logout"> LOGOUT</a>
    </nav>

    <h1>Pel·lícules disponibles</h1>

    <div class="movie-grid">
        <div th:each="movie : ${llista}" class="movie-card">
            <h3 th:text="${movie.titol}"></h3>
            <div class="movie-details">
                <!-- <span th:text="${movie.genere}">Gènere</span> -->
                <span class="separator">|</span>
                <span th:text="${movie.durada} + ' min'">0 min</span>
            </div>
            <a th:href="@{/client/pelicula/{id}(id=${movie.id})}" class="btn-sessions">Sessions</a>
        </div>
    </div>
</body>
